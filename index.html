.primary{font:inherit;font-weight:700;background:var(--gold);color:#1a1405;border:0;border-radius:8px;padding:11px 16px;cursor:pointer}

.row-actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.msg{margin:0;font-size:14px;min-height:1.5em}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#16325a;border:1px solid #3d6bb0;color:var(--text);padding:10px 16px;border-radius:8px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4)}

    if(r()<.12)continue;

    if(cx>520&&cx<1080&&cy>622&&cy<672)continue;
    if(cx>1500&&cy<110)continue;
    if(inLandmark(cx,cy))continue;
    var skip=false;
    for(var k=0;k<geo.length;k++){var q=geo[k];if(Math.abs(cx-q.bx)<16){skip=true;break}if(Math.abs(cx-q.bx)<80&&cy>q.yT-112&&cy<q.yT-48){skip=true;break}}
    if(!skip)for(var p=0;p<parks.length;p++){var P=parks[p],dx=(cx-P.x)/(P.rx+8),dy=(cy-P.y)/(P.ry+8);if(dx*dx+dy*dy<1){skip=true;break}}
    if(skip)continue;
    var pal=cy<yc(cx)?FP:FG;
    s+='<rect x="'+f1(bx0)+'" y="'+f1(by0)+'" width="'+f1(w)+'" height="'+f1(h)+'" rx="1.5" fill="'+pal[(r()*pal.length)|0]+'" opacity="'+f1(.62+r()*.3)+'"/>';
    s+='<path d="M'+f1(bx0+1)+' '+f1(by0+h/2)+'h'+f1(w-2)+'" stroke="#0b1424" stroke-width=".8" opacity=".35"/>';
    if(r()<.22)s+='<rect x="'+f1(bx0+2+r()*(w-5))+'" y="'+f1(by0+2+r()*(h-5))+'" width="2.6" height="2.6" fill="#ffe29a" opacity="'+f1(.6+r()*.4)+'"/>';
  }}
  s+=landmarks(r);
  // river
  s+='<path d="M'+top.join(" L")+" L"+bot.slice().reverse().join(" L")+'Z" fill="url(#riverG)"/>';
  s+='<polyline points="'+top.join(" ")+'" fill="none" stroke="#7f97c4" stroke-width="2" opacity=".55"/><polyline points="'+bot.join(" ")+'" fill="none" stroke="#7f97c4" stroke-width="2" opacity=".55"/>';
  for(var i=0;i<110;i++){var rx=r()*1600,off=(r()*2-1)*(hw(rx)-12),ry=yc(rx)+off,len=8+r()*22;s+='<path class="ripple" style="animation-delay:-'+f1(r()*5)+'s" d="M'+f1(rx)+' '+f1(ry)+'h'+f1(len)+'" stroke="#9fbcf0" stroke-width="1.5" stroke-linecap="round" opacity=".2"/>';}
  [192,240,288,334].forEach(function(mx,k){var my=yc(mx)+hw(mx)-13;s+='<g transform="translate('+f1(mx)+' '+f1(my)+') scale(.5)" opacity=".85"><path d="M-42 -14Q-36 -4 -26 3Q0 10 28 3Q34 -2 38 -10L32 -6L-30 -6Z" fill="#5a3a24" stroke="#1f140b" stroke-width="2"/><g fill="#8a5c34" stroke="#3a2616"><ellipse cx="-18" cy="-9" rx="4" ry="3.4"/><ellipse cx="-8" cy="-9" rx="4" ry="3.4"/><ellipse cx="2" cy="-9" rx="4" ry="3.4"/></g><line x1="-6" y1="-6" x2="-6" y2="-46" stroke="#2b1d12" stroke-width="3"/><rect x="-22" y="-46" width="32" height="6" rx="3" fill="#e3d5b8" stroke="#6b5a40"/></g>'});
  geo.forEach(function(q){s+='<ellipse cx="'+f1(q.bx)+'" cy="'+f1(yc(q.bx))+'" rx="60" ry="'+f1(hw(q.bx))+'" fill="url(#glow)"/>';for(var k=0;k<8;k++){var yy=yc(q.bx)+(r()*2-1)*(hw(q.bx)-10);s+='<path d="M'+f1(q.bx-18-r()*16)+' '+f1(yy)+'h'+f1(6+r()*8)+'M'+f1(q.bx+14+r()*14)+' '+f1(yy+3)+'h'+f1(6+r()*8)+'" stroke="#f2c46b" stroke-width="1.4" stroke-linecap="round" opacity=".4"/>';}});
  // labels
  s+='<text x="800" y="64" text-anchor="middle" font-family="Big Shoulders Display, Arial Narrow, sans-serif" font-weight="800" font-size="34" letter-spacing="14" fill="#5f79ad">PORTO</text>';
  s+='<text x="800" y="656" text-anchor="middle" font-family="Big Shoulders Display, Arial Narrow, sans-serif" font-weight="800" font-size="30" letter-spacing="12" fill="#5f79ad">VILA NOVA DE GAIA</text>';
  s+='<text x="870" y="'+f1(yc(870)+hw(870)-14)+'" text-anchor="middle" font-family="Figtree, sans-serif" font-style="italic" font-weight="500" font-size="16" letter-spacing="10" fill="#9fbcf0" opacity=".35">RIO DOURO</text>';
  s+='<text x="26" y="'+f1(yc(26)+5)+'" font-family="Figtree, sans-serif" font-weight="700" font-size="12" letter-spacing="3" fill="#9fbcf0" opacity=".6">◂ FOZ</text>';
  // start line
  var sx=X0-46;
  s+='<path d="M'+f1(sx)+' '+f1(yc(sx)-hw(sx)+4)+'V'+f1(yc(sx)+hw(sx)-4)+'" stroke="#e8edf7" stroke-width="3" stroke-dasharray="7 7" opacity=".7"/>';
  s+='<text x="'+f1(sx)+'" y="'+f1(yc(sx)+hw(sx)-9)+'" text-anchor="middle" font-family="Big Shoulders Display, Arial Narrow, sans-serif" font-weight="700" font-size="18" letter-spacing="4" fill="#e8edf7" stroke="#0a1c3a" stroke-width="5" paint-order="stroke">PARTIDA</text>';
  // compass
  s+='<g transform="translate(1548 58)"><circle r="24" fill="#0e1a30" stroke="#3d5687"/><path d="M0 -17L6 4L0 0L-6 4Z" fill="#e8edf7"/><path d="M0 17L6 4L0 0L-6 4Z" fill="#5f79ad"/><text y="-28" text-anchor="middle" font-family="Figtree, sans-serif" font-weight="700" font-size="12" fill="#8c9cbd">N</text></g>';
  BRIDGES.forEach(function(b,i){s+=drawBridge(b,i)});
  TEAMS.slice().sort(function(a,b){return a.lane-b.lane}).forEach(function(t){

      '<text x="-6" y="-80" text-anchor="middle" font-family="Figtree, sans-serif" font-weight="700" font-size="13" letter-spacing="2" fill="#e8edf7" stroke="#0b1424" stroke-width="3" paint-order="stroke">'+esc(t.name.toUpperCase())+'</text></g>';

}

function placeBoat(id,lane,x){var g=document.getElementById("boat-"+id);if(g)g.setAttribute("transform","translate("+f1(x)+" "+f1(yc(x)+lane)+")")}
var shown={gaia:0,arrabida:0},anim=null;
function sailTo(target,dur){
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  var from={gaia:shown.gaia,arrabida:shown.arrabida};
  if(anim)cancelAnimationFrame(anim);
  if(reduce||!dur){TEAMS.forEach(function(t){shown[t.id]=target[t.id];placeBoat(t.id,t.lane,px(target[t.id]))});return}
  var t0=null;
  function step(ts){
    if(t0===null)t0=ts;
    var k=Math.min(1,(ts-t0)/dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    TEAMS.forEach(function(t){var p=from[t.id]+(target[t.id]-from[t.id])*e;shown[t.id]=p;placeBoat(t.id,t.lane,px(p))});
    if(k<1)anim=requestAnimationFrame(step);
  }
  anim=requestAnimationFrame(step);
}

/* ---------- legend ---------- */
function status(p){
  if(p>=BRIDGES.length*PER)return'Passou as <strong>'+BRIDGES.length+' pontes</strong>. Chegou à Foz!';
  var idx=Math.floor(p/PER),left=(idx+1)*PER-p;
  return'Próxima: <strong>'+esc(BRIDGES[idx].full)+'</strong> · faltam '+left+(left===1?' ponto':' pontos');
}
function miniBoat(t){return'<svg class="mini" viewBox="-50 -80 100 92" aria-hidden="true">'+boatShape(t)+'</svg>'}
function legend(){
  var a=state.gaia,b=state.arrabida;
  return TEAMS.map(function(t){
    var p=state[t.id],other=t.id==="gaia"?b:a,chip="";
    if(p>other)chip='<span class="chip">Na frente</span>';else if(p===other&&p>0)chip='<span class="chip">Empatados</span>';
    var pct=Math.min(p,BRIDGES.length*PER)/(BRIDGES.length*PER)*100,ticks="";
    BRIDGES.forEach(function(br,i){var at=(i+1)/BRIDGES.length*100;ticks+='<span class="tick'+(p>=(i+1)*PER?' done':'')+'" style="left:'+at+'%"><em>'+esc(br.n)+'</em></span>'});
    return'<article class="team" data-team="'+t.id+'">'+miniBoat(t)+
      '<div class="who"><span class="name">'+esc(t.name)+'</span><span class="store">Loja '+esc(t.name)+'</span>'+chip+'</div>'+
      '<div class="pts"><b>'+p+'</b><span>'+(p===1?'ponto':'pontos')+'</span></div>'+
      '<div class="track" aria-label="'+p+' de '+(BRIDGES.length*PER)+' pontos até à última ponte"><div class="bar"><i style="width:'+pct+'%;background:'+t.color+'"></i></div>'+ticks+'</div>'+
      '<p class="next">'+status(p)+'</p></article>';
  }).join("");
}
function fmtDate(iso){if(!iso)return"Ainda sem pontos registados";try{return"Atualizado a "+new Date(iso).toLocaleString("pt-PT",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"})}catch(e){return""}}

var root=document.getElementById("root");
root.innerHTML=
 '<div class="wrap">'+
  '<header><div><p class="kicker">Desafio de lojas · Douro</p><h1>Regata das Pontes</h1>'+

      '</div><div class="field"><label for="ghtoken">Token do GitHub (só na primeira vez nesta sessão)</label><input id="ghtoken" type="password" autocomplete="off"></div><div class="row-actions"><button class="primary" type="submit" id="saveBtn">Guardar e mover os barcos</button><button class="linkbtn" type="button" id="logout">Sair</button></div>'+

 '</div>';

var $=function(id){return document.getElementById(id)};
function store(k,v){try{if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){}}
function recall(k){try{return sessionStorage.getItem(k)}catch(e){return null}}

function applyState(n){state=n;$("board").innerHTML=legend();$("updated").textContent=fmtDate(n.updated);sailTo(n,1600)}
fetch("state.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(n){if(n&&typeof n.gaia==="number"&&typeof n.arrabida==="number"&&(n.gaia!==state.gaia||n.arrabida!==state.arrabida||n.updated!==state.updated)){if(!$("scoreForm").contains(document.activeElement))applyState(n)}}).catch(function(){});
sailTo({gaia:0,arrabida:0},0);

function showAdmin(open){$("admin").hidden=!open;$("openAdmin").hidden=open;var logged=recall("regata-admin")==="1";$("login").hidden=logged;$("panel").hidden=!logged;if(open)setTimeout(function(){(logged?$("in-gaia"):$("user")).focus()},0)}
$("openAdmin").onclick=function(){showAdmin(true)};

async function sha(txt){var buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0")}).join("")}
$("loginForm").addEventListener("submit",async function(e){
  e.preventDefault();var msg=$("loginMsg");msg.className="msg";msg.textContent="";
  var u=$("user").value.trim(),p=$("pass").value;
  var ok=false;try{ok=u===ADMIN_USER&&(await sha(u+"\n"+p))===PASS_HASH}catch(err){}
  if(!ok){msg.className="msg err";msg.textContent="Utilizador ou palavra-passe errados.";return}
  $("pass").value="";store("regata-admin","1");showAdmin(true);
});
root.addEventListener("click",function(e){
  var b=e.target.closest("[data-step]");if(!b)return;
  var inp=$(b.getAttribute("data-for"));var v=Math.max(0,Math.min(999,(parseInt(inp.value,10)||0)+Number(b.getAttribute("data-step"))));inp.value=v;
});

$("scoreForm").addEventListener("submit",async function(e){
  e.preventDefault();var msg=$("saveMsg");msg.className="msg";
  var next={updated:new Date().toISOString()},bad=false;
  TEAMS.forEach(function(t){var raw=$("in-"+t.id).value.trim(),v=Number(raw);if(raw===""||!Number.isInteger(v)||v<0||v>999)bad=true;next[t.id]=v});
  if(bad){msg.className="msg err";msg.textContent="Os pontos têm de ser números inteiros entre 0 e 999.";return}
  var btn=$("saveBtn");btn.disabled=true;msg.textContent="A guardar…";
  state=next;$("board").innerHTML=legend();$("updated").textContent=fmtDate(state.updated);sailTo(next,1200);
  var tok=$("ghtoken").value.trim()||recall("regata-token")||"";
  if(!tok){btn.disabled=false;msg.className="msg err";msg.textContent="Cola o token do GitHub para poder guardar.";return}
  var api="https://api.github.com/repos/"+REPO+"/contents/state.json",hd={Authorization:"Bearer "+tok,Accept:"application/vnd.github+json"};
  try{
    var cur=await fetch(api,{headers:hd,cache:"no-store"}),sha=null;
    if(cur.status===401||cur.status===403)throw{code:"auth"};
    if(cur.ok)sha=(await cur.json()).sha;
    var body={message:"pontos: Gaia "+next.gaia+" · Arrábida "+next.arrabida,content:btoa(JSON.stringify(next)),sha:sha||undefined};
    var put=await fetch(api,{method:"PUT",headers:hd,body:JSON.stringify(body)});
    if(put.status===401||put.status===403)throw{code:"auth"};
    if(put.status===409||put.status===422)throw{code:"conflict"};
    if(!put.ok)throw{code:"other"};
    store("regata-token",tok);$("ghtoken").value="";btn.disabled=false;msg.className="msg ok";msg.textContent="Pontos guardados. Ficam visíveis para todos em cerca de um minuto.";
  }catch(err){
    btn.disabled=false;msg.className="msg err";var c=err&&err.code;
    if(c==="auth")store("regata-token",null);
    msg.textContent=c==="auth"?"Token inválido ou sem permissão de escrita neste repositório.":c==="conflict"?"Alguém guardou ao mesmo tempo. Volta a tentar.":"Não foi possível guardar os pontos. Tenta outra vez.";
  }
});

if(recall("regata-saved")==="1"){store("regata-saved",null);var tst=document.createElement("div");tst.className="toast";tst.setAttribute("role","status");tst.textContent="Pontos guardados. Os barcos já estão na nova posição.";document.body.appendChild(tst);setTimeout(function(){tst.remove()},4000)}
})();
